name: Probar y generar EXE
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --exclude-module numpy --name "PNG a PDF" png_a_pdf.py
      - uses: actions/upload-artifact@v4
        with:
          name: PNG-a-PDF-Windows
          path: dist/PNG a PDF.exe
